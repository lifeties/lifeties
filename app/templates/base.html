<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LifeTies 데모{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/app.css"></head>
<body>
<div class="demo-banner">DEMO · 결제·본인인증·계좌인증·문자 발송은 모두 모의로 처리되며 실제 금융거래는 발생하지 않습니다</div>
<header class="top"><div class="in"><a class="brand" href="/">LifeTies<small>{% block area %}경조금 간편 수납{% endblock %}</small></a>
<nav class="nav">{% block nav %}<a href="/host">혼주·상주</a><a href="/venue">식장</a><a href="/admin">운영자</a><a href="/support">고객센터</a>{% endblock %}</nav></div></header>
<main class="wrap {% block wrapclass %}{% endblock %}">
{% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<div class="footer">㈜와이즈앤코 · 행사 검증형 경조금 신용카드 간편 수납 서비스(혁신금융서비스 지정 신청 데모)</div>
</body></html>
