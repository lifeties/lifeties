{% extends "base.html" %}{% block wrapclass %}narrow{% endblock %}{% block content %}
<form class="card" method="post"><h2>고객센터 문의</h2><p class="small muted">접수 후 15일 이내에 문자로 답변드립니다. 결제 취소는 영수증 화면에서 직접 할 수 있습니다.</p>
<div class="row"><div><label>이름</label><input name="name" required></div><div><label>휴대폰</label><input name="phone" required></div></div>
<label>구분</label><select name="kind"><option value="general">일반 문의</option><option value="complaint">민원·불만</option></select>
<label>내용</label><textarea name="body" required></textarea><button class="btn" style="margin-top:12px">문의 접수</button></form>
{% endblock %}
