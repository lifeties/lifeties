{% extends "base.html" %}{% block area %}혼주·상주{% endblock %}{% block nav %}<a href="/host">내 행사</a><a class="on" href="/host/bank">정산 계좌</a>{% endblock %}{% block wrapclass %}narrow{% endblock %}{% block content %}
<form class="card" method="post" action="/host/bank"><div class="eyebrow">Step 2</div><h2>정산 계좌 등록</h2>
<p class="small muted">정산은 본인 명의 계좌로만 합니다(가상계좌 미사용). 1원을 보내 예금주를 확인합니다.</p>
<label>은행</label><select name="bank_name">{% for b in ['국민은행','신한은행','우리은행','하나은행','농협은행','기업은행','카카오뱅크','토스뱅크'] %}<option {{ 'selected' if u.bank_name==b }}>{{ b }}</option>{% endfor %}</select>
<label>계좌번호</label><input name="bank_account" required value="{{ u.bank_account or '' }}">
<label>예금주</label><input name="bank_holder" required value="{{ u.name }}">
<button class="btn block" style="margin-top:14px">1원 보내기(모의)</button></form>
{% if pending %}<form class="card" method="post" action="/host/bank/verify"><h3>입금자명 숫자 4자리</h3><input name="code" required maxlength="4" inputmode="numeric"><button class="btn block" style="margin-top:10px">확인</button></form>{% endif %}
{% endblock %}
